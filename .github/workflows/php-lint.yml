name: PHP Syntax Check

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  php-lint:
    name: Lint all PHP files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -iname '*.php' -not -path './.git/*' -print0)
          printf 'PHP files found: %s\n' "${#files[@]}"
          for file in "${files[@]}"; do
            php -l "$file"
          done
